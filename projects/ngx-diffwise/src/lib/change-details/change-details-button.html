<button
  type="button"
  class="diffwise-html-diff__change-details-icon diffwise-html-diff__change-details-icon--{{
    icon()
  }}"
  [attr.aria-label]="label()"
>
  @switch (icon()) {
    @case (iconKinds.Formatting) {
      <svg
        viewBox="0 0 16 16"
        aria-hidden="true"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
      >
        <path d="M3.5 3.5h9M8 3.5v7.5M4.5 13.5h7" />
      </svg>
    }
    @case (iconKinds.Link) {
      <svg
        viewBox="0 0 16 16"
        aria-hidden="true"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
      >
        <path
          d="M6.6 9.4l2.8-2.8M7.2 4.6l.9-.9a2.6 2.6 0 013.7 3.7l-.9.9M8.8 11.4l-.9.9a2.6 2.6 0 01-3.7-3.7l.9-.9"
        />
      </svg>
    }
    @case (iconKinds.Image) {
      <svg
        viewBox="0 0 16 16"
        aria-hidden="true"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <rect x="2.2" y="3" width="11.6" height="10" rx="1.6" />
        <path d="M3 11.6l3.1-3.1 2.4 2.4 1.7-1.7 2.8 2.8" stroke-linejoin="round" />
        <circle cx="10.6" cy="6.2" r="1.1" fill="currentColor" stroke="none" />
      </svg>
    }
    @case (iconKinds.ListMarker) {
      <svg
        viewBox="0 0 16 16"
        aria-hidden="true"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      >
        <circle cx="3.4" cy="4.5" r="1.2" fill="currentColor" stroke="none" />
        <circle cx="3.4" cy="8" r="1.2" fill="currentColor" stroke="none" />
        <circle cx="3.4" cy="11.5" r="1.2" fill="currentColor" stroke="none" />
        <path d="M6.6 4.5h6.6M6.6 8h6.6M6.6 11.5h6.6" />
      </svg>
    }
    @case (iconKinds.Checkbox) {
      <svg
        viewBox="0 0 16 16"
        aria-hidden="true"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="2.4" y="2.4" width="11.2" height="11.2" rx="2.4" stroke-width="1.5" />
        <path d="M5.2 8.3l2 2 3.7-4.3" stroke-width="1.6" />
      </svg>
    }
    @case (iconKinds.Multiple) {
      <svg
        viewBox="0 0 16 16"
        aria-hidden="true"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linejoin="round"
      >
        <path d="M8 2.2l5.6 3L8 8.2 2.4 5.2z" />
        <path d="M2.4 8.2L8 11.2l5.6-3M2.4 11L8 14l5.6-3" stroke-linecap="round" />
      </svg>
      <span class="diffwise-html-diff__change-details-count" aria-hidden="true">{{
        details().length
      }}</span>
    }
  }
</button>
