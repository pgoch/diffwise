<div class="diffwise-html-diff__version-headers">
  <div class="diffwise-html-diff__version-header diffwise-html-diff__version-header--old">
    {{ versionHeaders.old }}
  </div>
  <div class="diffwise-html-diff__version-header diffwise-html-diff__version-header--new">
    {{ versionHeaders.new }}
  </div>
</div>

@for (row of rows(); track $index) {
  <div class="diffwise-html-diff__row diffwise-html-diff__row--{{ row.kind }}">
    @if (row.oldLine; as line) {
      <div class="diffwise-html-diff__line-number diffwise-html-diff__line-number--old">
        <span class="diffwise-html-diff__line-number-value">{{ line.number }}</span>
      </div>
      <div
        class="diffwise-html-diff__content diffwise-html-diff__content--old"
        [innerHTML]="line.html"
      ></div>
    } @else {
      <div class="diffwise-html-diff__gap" aria-hidden="true"></div>
    }

    <div class="diffwise-html-diff__divider" aria-hidden="true"></div>

    @if (row.newLine; as line) {
      <div class="diffwise-html-diff__line-number diffwise-html-diff__line-number--new">
        <span class="diffwise-html-diff__line-number-value">{{ line.number }}</span>
      </div>
      <div
        class="diffwise-html-diff__content diffwise-html-diff__content--new"
        [innerHTML]="line.html"
      ></div>
    } @else {
      <div class="diffwise-html-diff__gap" aria-hidden="true"></div>
    }
  </div>
}
