<header class="site-bar">
  <a class="site-brand" href="#">
    <span class="site-logo" aria-hidden="true"><span></span><span></span></span>
    Diffwise
  </a>
  <nav class="site-nav" aria-label="Site">
    <a href="#demo" [attr.aria-current]="page() === pages.Demo ? 'page' : null">Demo</a>
    <a [href]="links.docs">Docs</a>
    <a [href]="links.github">GitHub</a>
  </nav>
  <span class="site-version">v{{ version }}</span>
</header>

@switch (page()) {
  @case (pages.Demo) {
    <demo-demo-page />
  }
}
