<header class="demo-header">
  <h1>Diffwise demo</h1>
  <label>
    Language
    <select (change)="selectLanguage($event)">
      @for (option of languages; track option.value) {
        <option [value]="option.value" [selected]="option.value === language()">
          {{ option.label }}
        </option>
      }
    </select>
  </label>
  <label>
    Sample
    <select (change)="selectSize($event)">
      @for (option of sizes; track option.value) {
        <option [value]="option.value" [selected]="option.value === size()">
          {{ option.label }}
        </option>
      }
    </select>
  </label>
  <label>
    Headers
    <select (change)="selectVersionHeaders($event)">
      @for (option of versionHeaderChoices; track $index) {
        <option [value]="$index" [selected]="$index === versionHeaderChoice()">
          {{ option.label }}
        </option>
      }
    </select>
  </label>
  <label>
    <input type="checkbox" [checked]="showLineNumbers()" (change)="toggleLineNumbers($event)" />
    Line numbers
  </label>
  <div class="demo-theme" role="group" aria-labelledby="demo-theme-label">
    <span id="demo-theme-label">Theme</span>
    <button
      type="button"
      [attr.aria-pressed]="colorMode() === colorModes.Light"
      (click)="diffwise.switchToLightMode()"
    >
      Light
    </button>
    <button
      type="button"
      [attr.aria-pressed]="colorMode() === colorModes.Dark"
      (click)="diffwise.switchToDarkMode()"
    >
      Dark
    </button>
    <button
      type="button"
      [attr.aria-pressed]="colorMode() === colorModes.Auto"
      (click)="diffwise.switchToAutoMode()"
    >
      Auto
    </button>
    <button type="button" (click)="diffwise.toggleDarkMode()">Toggle</button>
  </div>
</header>

<main class="demo-main">
  @if (sample.error()) {
    <p role="alert">The sample could not be loaded.</p>
  } @else if (sample.value(); as pair) {
    <diffwise-html-diff
      [oldHtml]="pair.oldHtml"
      [newHtml]="pair.newHtml"
      [showLineNumbers]="showLineNumbers()"
      [language]="interfaceLanguage()"
    />
  }
</main>
