<div class="option-name" [id]="ids.name">
  {{ name() }}
  @if (changed()) {
    <span class="option-dot" title="Changed"><span class="option-hidden">(changed)</span></span>
  }
</div>
<p class="option-description" [id]="ids.description">{{ description() }}</p>
<div
  class="option-choices"
  role="group"
  [attr.aria-labelledby]="ids.name"
  [attr.aria-describedby]="describedBy()"
>
  @for (choice of choices(); track $index) {
    <button
      type="button"
      class="option-choice"
      [attr.aria-pressed]="choice.value === value()"
      [disabled]="isDisabled()"
      (click)="chosen.emit(choice.value)"
    >
      {{ choice.label }}
      @if (choice.value === defaultValue()) {
        <span class="option-default">default</span>
      }
    </button>
  } @empty {
    <ng-content />
  }
</div>
@if (disabledNote(); as note) {
  <p class="option-note" [id]="ids.note">{{ note }}</p>
}
